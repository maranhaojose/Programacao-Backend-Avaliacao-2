services:
  postgres:
    image: postgres:16-alpine
    container_name: trip_requests_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trip_user
      POSTGRES_PASSWORD: trip_password
      POSTGRES_DB: trip_requests
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip_user -d trip_requests"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
